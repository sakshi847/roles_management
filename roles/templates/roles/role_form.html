
{% extends 'base.html' %}

{% block head %}
<style>
    .form-container {
        max-width: 500px;
        background: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        margin: auto;
        margin-top: 50px;
    }
    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }
    .btn {
        margin-top: 10px;
        width: 100%;
        font-size: 1rem;
    }
    .btn-secondary {
        background-color: #6c757d;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h2>{% if form.instance.pk %}Update Role{% else %}Create Role{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'role_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
