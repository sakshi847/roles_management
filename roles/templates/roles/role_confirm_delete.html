
{% extends 'base.html' %}

{% block head %}
<style>
    .delete-container {
        max-width: 400px;
        background: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        margin: auto;
        margin-top: 50px;
        text-align: center;
    }
    h2 {
        color: #d9534f;
        margin-bottom: 15px;
    }
    p {
        margin-bottom: 20px;
        font-size: 1.1rem;
    }
    .btn {
        margin: 5px;
        width: 120px;
    }
</style>
{% endblock %}

{% block content %}
<div class="delete-container">
    <h2>Confirm Delete</h2>
    <p>Are you sure you want to delete the role "<strong>{{ role.role_name }}</strong>"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm</button>
        <a href="{% url 'role_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
