{% extends 'base.html' %}

{% block head %}
<style>
    .home-container {
        max-width: 600px;
        background: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0px 0px 12px rgba(0, 0, 0, 0.1);
        text-align: center;
        margin: auto;
        margin-top: 50px;
    }
    h1 {
        color: #343a40;
        font-size: 2rem;
        margin-bottom: 15px;
    }
    p {
        font-size: 1.1rem;
        color: #555;
        margin-bottom: 20px;
    }
    .btn-primary {
        font-size: 1rem;
        padding: 10px 20px;
    }
</style>
{% endblock %}

{% block content %}
<div class="home-container">
    <h1>Welcome</h1>
    <p>Role management system is available for admin users. Please log in to access the system.</p>
    <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
</div>
{% endblock %}
